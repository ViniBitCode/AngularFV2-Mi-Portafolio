<footer id="footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <span class="footer-name">Facundo Vinitzca<span class="footer-dash">_</span></span>
      <p class="footer-tagline">{{ ui().footer.tagline }}</p>
    </div>

    <nav class="footer-nav" aria-label="Footer">
      <button type="button" (click)="navigate('presentation-first-container')">
        {{ ui().nav.about }}
      </button>
      <button type="button" (click)="navigate('presentation-second-container')">
        {{ ui().nav.projects }}
      </button>
      <button type="button" (click)="navigate('presentation-third-container')">
        {{ ui().nav.contact }}
      </button>
    </nav>

    <ul class="footer-socials">
      @for (social of socials; track social.name) {
        <li>
          <a
            [href]="social.url"
            [attr.aria-label]="social.name"
            [title]="social.name"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img [src]="social.icon" [alt]="social.name" />
          </a>
        </li>
      }
    </ul>
  </div>
</footer>
