<footer id="footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <span class="footer-name">Facundo Vinitzca<span class="footer-dash" aria-hidden="true">_</span></span>
    </div>

    <nav class="footer-nav" aria-label="Footer">
      @for (item of navItems; track item.sectionId) {
        <button type="button" (click)="navigate(item.sectionId)">
          {{ ui().nav[item.key] }}
        </button>
      }
    </nav>

    <ul class="footer-socials">
      @for (social of socials; track social.name) {
        <li>
          <a
            [href]="social.url"
            [attr.aria-label]="social.name"
            [title]="social.name"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img [src]="social.icon" [alt]="social.name" />
          </a>
        </li>
      }
    </ul>
  </div>

  <p class="footer-credit">
    © {{ currentYear }} · {{ ui().footer.credit }}
    <a class="footer-credit-link" [href]="ui().footer.brandUrl" target="_blank" rel="noopener noreferrer">
      {{ ui().footer.brandName }}
    </a>
  </p>
</footer>
