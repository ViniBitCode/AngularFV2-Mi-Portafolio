<section id="header">
    <div class="left-text">
        <h1>Mi Portafolio</h1>
        <span class="left-text-dash">_</span>
    </div>

    <div class="right-text">
        <button (click)="navigate('presentation-first-container')"> Sobre mi </button>
        <button (click)="navigate('presentation-second-container')"> Proyectos </button>
        <button (click)="navigate('presentation-third-container')"> Contacto </button>
        <a
          class="github-link"
          [href]="githubUrl"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Mi perfil de GitHub"
          title="GitHub"
        >
          <img src="icons/github_icon.svg" alt="GitHub" />
        </a>
    </div>
</section>
