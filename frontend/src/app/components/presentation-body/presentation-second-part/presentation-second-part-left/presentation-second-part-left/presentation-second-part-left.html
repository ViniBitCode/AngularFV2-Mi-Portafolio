<section class="left-projects-container">
  <div class="head-presentation">
    <h1></h1>
    <h1 style="color: rgb(90, 90, 248)">Personales</h1>
  </div>
  <div class="left-project-image-carrousel">
    <!-- Importado desde https://coreui.io/angular/docs/components/carousel/#how-it-works  -->
    <c-carousel [dark]="true" [wrap]="false" transition="slide" >
      <c-carousel-indicators />
      <c-carousel-inner>
        @for (slide of slides; track slide.src) {
          <c-carousel-item>
            <img
              alt="{{ slide.title }}"
              class="carrousel-image"
              loading="lazy"
              src="{{ slide.src }}"
            />
            <c-carousel-caption class="d-none d-md-block">
              <h3>{{ slide.title }}</h3>
              <p>{{ slide.subtitle }}</p>
            </c-carousel-caption>
          </c-carousel-item>
        }
      </c-carousel-inner>
      <c-carousel-control caption="Previous" direction="prev" />
      <c-carousel-control caption="Next" direction="next" />
    </c-carousel>
  </div>

  <div class="left-project-description-text">
    <p>Proyectos personales enfocados a desarrollo backend con Java. <br /></p>
  </div>
  <button></button>
</section>
