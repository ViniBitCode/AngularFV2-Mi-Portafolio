<section id="presentation-third-container">
  <div class="presentation-form-container">
    <div class="head-presentation">
      <h1 style="color: rgb(90, 90, 248)">Contacta conmigo</h1>
    </div>
    <div class="form-consultant-container">
      <form [formGroup]="consultForm">
        <label for="full-name-consultant"> Nombre completo </label><br />
        <input id="consultant-text-input" type="text" formControlName="full_name_consultant" /><br />
        <label for="email-consultant"> Email </label><br />
        <input id="consultant-email-input" type="email" formControlName="email_consultant" /><br />
        <label for="message-consultant"> Mensaje </label><br />
        <textarea id="consultant-text-message" formControlName="message_consultant"></textarea><br />
        <button type="submit" class="send-button">Enviar</button>
      </form>
    </div>
  </div>
</section>
